name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and CLI integration tests
        run: python -m unittest discover -s engine/tests -p "test_*.py" -v
      - name: Build the bundled example
        run: |
          python scripts/story.py build examples/mini-story --single
          python scripts/story.py verify examples/mini-story
